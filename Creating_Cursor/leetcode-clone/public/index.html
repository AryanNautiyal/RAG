<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeCraft — LeetCode Elite Platform</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: {
              bg: '#1a1a1a',
              card: '#262626',
              border: '#333333',
              hover: '#2a2a2a',
              input: '#1f1f1f',
              text: '#e5e7eb',
              muted: '#9ca3af'
            },
            leetcode: {
              yellow: '#ffa116',
              yellowHover: '#ffb833',
              green: '#2cbb5d',
              greenHover: '#32cd68',
              darkBg: '#1e1e1e',
              panel: '#282828',
              active: '#3c3c3c'
            }
          }
        }
      }
    }
  </script>
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .code-font {
      font-family: 'Fira Code', monospace;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1e1e1e;
    }
    ::-webkit-scrollbar-thumb {
      background: #3a3a3a;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #555;
    }
    /* Resizer bar */
    .resizer {
      width: 5px;
      background: #282828;
      cursor: col-resize;
      transition: background 0.2s;
    }
    .resizer:hover, .resizer.active {
      background: #ffa116;
    }
  </style>
</head>
<body class="bg-leetcode-darkBg text-dark-text h-screen flex flex-col overflow-hidden select-none">

  <!-- Top Navigation Bar -->
  <header class="h-14 bg-[#282828] border-b border-[#333333] flex items-center justify-between px-4 z-50 shrink-0">
    <div class="flex items-center space-x-6">
      <div class="flex items-center space-x-2 cursor-pointer" onclick="location.reload()">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-amber-500 to-orange-600 flex items-center justify-center shadow-md">
          <i class="fa-solid fa-code text-white text-sm"></i>
        </div>
        <span class="font-bold text-lg tracking-tight bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">CodeCraft</span>
      </div>

      <!-- Problem Selector Dropdown / Navigation -->
      <nav class="hidden md:flex items-center space-x-1 text-sm font-medium">
        <div class="relative group">
          <button id="problemListBtn" class="flex items-center space-x-2 px-3 py-1.5 rounded-md hover:bg-leetcode-active text-gray-300 transition">
            <i class="fa-solid fa-list text-amber-500"></i>
            <span id="navProblemTitle">1. Two Sum</span>
            <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
          </button>
          <!-- Dropdown menu -->
          <div id="problemDropdown" class="absolute left-0 mt-1 w-72 bg-[#2d2d2d] border border-[#3f3f3f] rounded-lg shadow-2xl hidden z-50 py-1">
            <div class="px-3 py-2 text-xs font-semibold text-gray-400 border-b border-[#383838]">SELECT PROBLEM</div>
            <div id="problemDropdownItems" class="max-h-64 overflow-y-auto">
              <!-- Populated via JS -->
            </div>
          </div>
        </div>

        <button onclick="switchTab('explore')" class="px-3 py-1.5 rounded-md hover:bg-leetcode-active text-gray-400 hover:text-gray-200 transition">
          <i class="fa-solid fa-compass mr-1.5"></i> Explore
        </button>
      </nav>
    </div>

    <!-- Center status / timer -->
    <div class="hidden lg:flex items-center space-x-4 bg-[#1f1f1f] px-3 py-1 rounded-full border border-[#333] text-xs text-gray-400">
      <span class="flex items-center text-emerald-400"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse mr-1.5"></span> Live Server</span>
      <span>|</span>
      <span id="timerDisplay"><i class="fa-regular fa-clock mr-1 text-amber-500"></i> 00:00</span>
    </div>

    <!-- Right User actions -->
    <div class="flex items-center space-x-3">
      <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-full bg-[#333] hover:bg-[#444] flex items-center justify-center text-gray-300 transition" title="Toggle Theme">
        <i class="fa-solid fa-moon" id="themeIcon"></i>
      </button>
      <button class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-500 border border-amber-500/30 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-1.5 transition">
        <i class="fa-solid fa-crown text-amber-400"></i>
        <span>Premium</span>
      </button>
      <div class="w-9 h-9 rounded-full bg-gradient-to-r from-purple-500 to-indigo-500 flex items-center justify-center font-bold text-white text-sm shadow cursor-pointer">
        JD
      </div>
    </div>
  </header>

  <!-- Main Splitter Layout -->
  <main class="flex-1 flex overflow-hidden relative" id="mainLayout">

    <!-- LEFT PANEL: Problem Statement -->
    <section id="leftPanel" class="w-1/2 flex flex-col bg-leetcode-panel border-r border-[#333333] h-full overflow-hidden">
      <!-- Problem Tabs Header -->
      <div class="flex items-center justify-between px-4 bg-[#222222] border-b border-[#333333] h-10 shrink-0">
        <div class="flex items-center space-x-2 text-sm">
          <button class="px-3 py-1.5 font-medium text-amber-400 border-b-2 border-amber-400 bg-leetcode-active/50 rounded-t flex items-center space-x-1.5">
            <i class="fa-solid fa-book-open text-xs"></i>
            <span>Description</span>
          </button>
          <button onclick="showToast('Editorial unlocked for Premium users!')" class="px-3 py-1.5 font-medium text-gray-400 hover:text-gray-200 flex items-center space-x-1.5 transition">
            <i class="fa-solid fa-lightbulb text-xs"></i>
            <span>Editorial</span>
          </button>
          <button onclick="showToast('Viewing community solutions')" class="px-3 py-1.5 font-medium text-gray-400 hover:text-gray-200 flex items-center space-x-1.5 transition">
            <i class="fa-solid fa-comments text-xs"></i>
            <span>Solutions</span>
          </button>
          <button onclick="showToast('Submissions history loaded')" class="px-3 py-1.5 font-medium text-gray-400 hover:text-gray-200 flex items-center space-x-1.5 transition">
            <i class="fa-solid fa-clock-rotate-left text-xs"></i>
            <span>Submissions</span>
          </button>
        </div>
        <div class="flex items-center space-x-2 text-gray-400 text-xs">
          <button onclick="toggleBookmark(this)" class="hover:text-amber-400 transition p-1" title="Bookmark"><i class="fa-regular fa-bookmark"></i></button>
          <button onclick="toggleLike(this)" class="hover:text-red-400 transition p-1" title="Like"><i class="fa-regular fa-thumbs-up"></i></button>
          <button onclick="shareProblem()" class="hover:text-blue-400 transition p-1" title="Share"><i class="fa-solid fa-share-nodes"></i></button>
        </div>
      </div>

      <!-- Problem Content Scrollable -->
      <div id="problemContent" class="flex-1 overflow-y-auto p-6 space-y-6 text-sm text-gray-300">
        <!-- Loaded via JS -->
      </div>
    </section>

    <!-- Resizer Bar -->
    <div id="dragResizer" class="resizer hidden md:block"></div>

    <!-- RIGHT PANEL: Code Editor & Compiler -->
    <section id="rightPanel" class="w-1/2 flex flex-col bg-leetcode-darkBg h-full overflow-hidden">
      
      <!-- Editor Top Toolbar -->
      <div class="h-11 bg-[#282828] border-b border-[#333333] flex items-center justify-between px-4 shrink-0">
        <div class="flex items-center space-x-3">
          <div class="flex items-center space-x-1.5 text-xs text-gray-300 font-medium">
            <i class="fa-solid fa-code text-amber-500"></i>
            <span>Code</span>
          </div>
          <!-- Language Selector -->
          <div class="relative">
            <select id="languageSelect" onchange="changeLanguage(this.value)" class="bg-[#1e1e1e] border border-[#3f3f3f] text-gray-200 text-xs rounded px-2.5 py-1.5 focus:outline-none focus:border-amber-500 cursor-pointer">
              <option value="javascript">JavaScript</option>
              <option value="python">Python 3</option>
              <option value="cpp">C++</option>
            </select>
          </div>
        </div>

        <div class="flex items-center space-x-2">
          <button onclick="resetCode()" class="px-2.5 py-1 text-xs text-gray-400 hover:text-gray-200 hover:bg-[#333] rounded transition flex items-center space-x-1" title="Reset Code">
            <i class="fa-solid fa-rotate-right"></i>
            <span class="hidden sm:inline">Reset</span>
          </button>
          <button onclick="toggleFullscreen()" class="px-2.5 py-1 text-xs text-gray-400 hover:text-gray-200 hover:bg-[#333] rounded transition" title="Toggle Fullscreen">
            <i class="fa-solid fa-expand"></i>
          </button>
        </div>
      </div>

      <!-- Code Editor Textarea / Simulated IDE -->
      <div class="flex-1 relative flex flex-col bg-[#1e1e1e] overflow-hidden">
        <div class="absolute inset-0 flex">
          <!-- Line Numbers -->
          <div id="lineNumbers" class="w-12 py-4 bg-[#1e1e1e] text-right pr-3 font-mono text-xs text-gray-600 select-none border-r border-[#2d2d2d] overflow-hidden leading-6">
            1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10<br>11<br>12<br>13<br>14<br>15
          </div>
          <!-- Code Textarea -->
          <textarea id="codeEditor" spellcheck="false" oninput="updateLineNumbers(); updateCodeStorage();" onkeydown="handleEditorKeydown(event)" class="flex-1 bg-transparent text-gray-200 code-font text-sm p-4 resize-none focus:outline-none leading-6 whitespace-pre tab-size-4" placeholder="// Write your solution here..."></textarea>
        </div>
      </div>

      <!-- Bottom Console / Test Results Panel -->
      <div id="consolePanel" class="h-64 bg-[#242424] border-t border-[#333333] flex flex-col shrink-0 transition-all duration-200">
        <!-- Console Header -->
        <div class="flex items-center justify-between px-4 bg-[#282828] border-b border-[#333333] h-10 select-none">
          <div class="flex items-center space-x-4 text-xs font-medium">
            <button onclick="toggleConsole()" class="flex items-center space-x-1.5 text-gray-300 hover:text-white">
              <i class="fa-solid fa-terminal text-amber-500"></i>
              <span>Test Results & Console</span>
              <i id="consoleChevron" class="fa-solid fa-chevron-up text-[10px] text-gray-400 transition-transform"></i>
            </button>
          </div>
          <div class="flex items-center space-x-2">
            <span id="consoleStatusBadge" class="text-[11px] px-2 py-0.5 rounded bg-gray-700 text-gray-300 font-medium">Ready</span>
          </div>
        </div>

        <!-- Console Body -->
        <div id="consoleBody" class="flex-1 overflow-y-auto p-4 text-xs font-mono text-gray-300 space-y-3">
          <div class="text-gray-500 italic">// Click "Run Code" to test against sample test cases or "Submit" to run against all test suites.</div>
          <div id="testCaseTabs" class="flex items-center space-x-2 pt-2">
            <!-- Dynamically populated test cases -->
          </div>
          <div id="consoleOutput" class="mt-2 text-gray-300">
            <!-- Execution output details -->
          </div>
        </div>

        <!-- Action Footer Buttons (Run & Submit) -->
        <div class="h-14 bg-[#222222] border-t border-[#333333] px-4 flex items-center justify-between shrink-0">
          <div class="flex items-center space-x-2 text-xs text-gray-400">
            <button onclick="toggleConsole()" class="hover:text-gray-200 px-2 py-1 rounded bg-[#2d2d2d] border border-[#3d3d3d] transition">
              <i class="fa-solid fa-square-caret-up mr-1"></i> Console
            </button>
          </div>
          <div class="flex items-center space-x-3">
            <button onclick="runCode()" id="runBtn" class="px-4 py-2 bg-[#333333] hover:bg-[#3d3d3d] text-gray-200 font-semibold rounded-lg text-xs flex items-center space-x-2 transition border border-[#444] shadow-sm active:scale-95">
              <i class="fa-solid fa-play text-emerald-400 text-[10px]"></i>
              <span>Run Code</span>
            </button>
            <button onclick="submitCode()" id="submitBtn" class="px-5 py-2 bg-leetcode-green hover:bg-leetcode-greenHover text-white font-semibold rounded-lg text-xs flex items-center space-x-2 transition shadow-lg shadow-emerald-900/30 active:scale-95">
              <i class="fa-solid fa-cloud-arrow-up text-[11px]"></i>
              <span>Submit</span>
            </button>
          </div>
        </div>
      </div>

    </section>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 bg-[#2d2d2d] border border-[#444] text-white px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
    <div id="toastIcon" class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs">
      <i class="fa-solid fa-check"></i>
    </div>
    <span id="toastMessage" class="text-xs font-medium">Action completed successfully!</span>
  </div>

  <!-- Client JavaScript Logic -->
  <script>
    let currentProblemId = 1;
    let problemsList = [];
    let currentProblemData = null;
    let currentLanguage = 'javascript';
    let userCodes = {}; // { problemId: { javascript: '', python: '', cpp: '' } }
    let isConsoleExpanded = true;

    // Timer
    let secondsElapsed = 0;
    setInterval(() => {
      secondsElapsed++;
      const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const secs = String(secondsElapsed % 60).padStart(2, '0');
      document.getElementById('timerDisplay').innerHTML = `<i class="fa-regular fa-clock mr-1 text-amber-500"></i> ${mins}:${secs}`;
    }, 1000);

    // Initialize Application
    async function init() {
      try {
        const res = await fetch('/api/problems');
        problemsList = await res.json();
        renderProblemDropdown();
        await loadProblem(1);
      } catch (err) {
        showToast("Error connecting to server", "error");
      }
    }

    function renderProblemDropdown() {
      const container = document.getElementById('problemDropdownItems');
      container.innerHTML = problemsList.map(p => `
        <div onclick="loadProblem(${p.id})" class="px-3 py-2.5 hover:bg-leetcode-active cursor-pointer flex items-center justify-between transition border-b border-[#353535]/50">
          <div>
            <div class="text-xs font-medium text-gray-200">${p.title}</div>
            <div class="text-[10px] text-gray-400">${p.category}</div>
          </div>
          <span class="text-[10px] px-1.5 py-0.5 rounded font-semibold ${
            p.difficulty === 'Easy' ? 'bg-emerald-500/20 text-emerald-400' :
            p.difficulty === 'Medium' ? 'bg-amber-500/20 text-amber-400' : 'bg-red-500/20 text-red-400'
          }">${p.difficulty}</span>
        </div>
      `).join('');
    }

    // Toggle dropdown
    const problemListBtn = document.getElementById('problemListBtn');
    const problemDropdown = document.getElementById('problemDropdown');
    problemListBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      problemDropdown.classList.toggle('hidden');
    });
    window.addEventListener('click', () => {
      problemDropdown.classList.add('hidden');
    });

    async function loadProblem(id) {
      currentProblemId = id;
      try {
        const res = await fetch(`/api/problems/${id}`);
        currentProblemData = await res.json();
        
        document.getElementById('navProblemTitle').innerText = currentProblemData.title;
        
        // Render problem description
        const diffColor = currentProblemData.difficulty === 'Easy' ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20' :
                          currentProblemData.difficulty === 'Medium' ? 'text-amber-400 bg-amber-500/10 border-amber-500/20' : 'text-red-400 bg-red-500/10 border-red-500/20';

        let examplesHtml = currentProblemData.examples.map((ex, idx) => `
          <div class="bg-[#1f1f1f] border border-[#333] rounded-lg p-3 space-y-1.5 my-2">
            <div class="font-semibold text-xs text-gray-300">Example ${idx + 1}:</div>
            <div class="bg-[#181818] p-2 rounded text-xs code-font text-gray-300 border border-[#2a2a2a]">
              <div><strong class="text-gray-400">Input:</strong> ${ex.input}</div>
              <div><strong class="text-gray-400">Output:</strong> ${ex.output}</div>
              ${ex.explanation ? `<div><strong class="text-gray-400">Explanation:</strong> ${ex.explanation}</div>` : ''}
            </div>
          </div>
        `).join('');

        let constraintsHtml = currentProblemData.constraints.map(c => `<li class="text-gray-400">${c}</li>`).join('');

        document.getElementById('problemContent').innerHTML = `
          <div class="space-y-4">
            <h1 class="text-xl font-bold text-gray-100">${currentProblemData.title}</h1>
            <div class="flex items-center space-x-3 text-xs">
              <span class="px-2.5 py-0.5 rounded-full border font-medium ${diffColor}">${currentProblemData.difficulty}</span>
              <span class="text-gray-400 font-medium">${currentProblemData.category}</span>
              <span class="text-emerald-400 font-medium"><i class="fa-solid fa-check mr-1"></i> ${currentProblemData.acceptance}</span>
            </div>
            
            <div class="text-sm text-gray-300 leading-relaxed pt-2">
              ${markedParse(currentProblemData.description)}
            </div>

            <div class="pt-2">
              ${examplesHtml}
            </div>

            <div class="pt-2 space-y-2">
              <div class="font-semibold text-xs text-gray-200">Constraints:</div>
              <ul class="list-disc list-inside text-xs space-y-1">
                ${constraintsHtml}
              </ul>
            </div>
          </div>
        `;

        // Load Code into Editor
        if (!userCodes[currentProblemId]) {
          userCodes[currentProblemId] = { ...currentProblemData.defaultCode };
        }
        document.getElementById('codeEditor').value = userCodes[currentProblemId][currentLanguage];
        updateLineNumbers();
        renderTestCaseTabs();

      } catch (err) {
        showToast("Failed to load problem details", "error");
      }
    }

    // Simple Markdown parser helper for description formatting
    function markedParse(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong class="text-white">$1</strong>')
        .replace(/\*(.*?)\*/g, '<em class="text-gray-200">$1</em>')
        .replace(/`([^`]+)`/g, '<code class="bg-[#1e1e1e] px-1.5 py-0.5 rounded text-amber-400 code-font text-xs">$1</code>')
        .replace(/\n/g, '<br>');
    }

    function changeLanguage(lang) {
      currentLanguage = lang;
      if (userCodes[currentProblemId] && userCodes[currentProblemId][lang]) {
        document.getElementById('codeEditor').value = userCodes[currentProblemId][lang];
      } else if (currentProblemData && currentProblemData.defaultCode[lang]) {
        document.getElementById('codeEditor').value = currentProblemData.defaultCode[lang];
      }
      updateLineNumbers();
    }

    function updateCodeStorage() {
      if (!userCodes[currentProblemId]) {
        userCodes[currentProblemId] = {};
      }
      userCodes[currentProblemId][currentLanguage] = document.getElementById('codeEditor').value;
    }

    function updateLineNumbers() {
      const editor = document.getElementById('codeEditor');
      const lineCount = editor.value.split('\n').length;
      let numbers = '';
      for (let i = 1; i <= Math.max(lineCount, 15); i++) {
        numbers += i + '<br>';
      }
      document.getElementById('lineNumbers').innerHTML = numbers;
    }

    function handleEditorKeydown(e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = this.selectionStart;
        const end = this.selectionEnd;
        const val = this.value;
        this.value = val.substring(0, start) + "    " + val.substring(end);
        this.selectionStart = this.selectionEnd = start + 4;
        updateCodeStorage();
        updateLineNumbers();
      }
    }

    function resetCode() {
      if (currentProblemData) {
        userCodes[currentProblemId][currentLanguage] = currentProblemData.defaultCode[currentLanguage];
        document.getElementById('codeEditor').value = userCodes[currentProblemId][currentLanguage];
        updateLineNumbers();
        showToast("Code reset to default", "info");
      }
    }

    function renderTestCaseTabs() {
      if (!currentProblemData) return;
      const container = document.getElementById('testCaseTabs');
      container.innerHTML = currentProblemData.testCases.map((tc, idx) => `
        <button onclick="selectTestCase(${idx})" class="px-3 py-1 rounded bg-[#2e2e2e] hover:bg-[#383838] text-gray-300 border border-[#3d3d3d] text-xs font-mono transition ${idx === 0 ? 'border-amber-500 text-amber-400' : ''}" id="tcTab-${idx}">
          Case ${idx + 1}
        </button>
      `).join('');

      // Show first testcase input
      showTestCaseDetails(0);
    }

    function selectTestCase(idx) {
      document.querySelectorAll('[id^="tcTab-"]').forEach(el => {
        el.classList.remove('border-amber-500', 'text-amber-400');
      });
      document.getElementById(`tcTab-${idx}`).classList.add('border-amber-500', 'text-amber-400');
      showTestCaseDetails(idx);
    }

    function showTestCaseDetails(idx) {
      if (!currentProblemData) return;
      const tc = currentProblemData.testCases[idx];
      const outputDiv = document.getElementById('consoleOutput');
      outputDiv.innerHTML = `
        <div class="space-y-2">
          <div class="text-gray-400 font-semibold">Testcase ${idx + 1} Input:</div>
          <div class="bg-[#1c1c1c] p-2.5 rounded border border-[#333] text-gray-200 code-font">
            ${JSON.stringify(tc, null, 2)}
          </div>
        </div>
      `;
    }

    async function runCode() {
      const code = document.getElementById('codeEditor').value;
      const runBtn = document.getElementById('runBtn');
      runBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-xs"></i><span>Running...</span>`;
      runBtn.disabled = true;

      document.getElementById('consoleStatusBadge.innerText = "Running..."');
      document.getElementById('consoleOutput').innerHTML = `<div class="flex items-center space-x-2 text-amber-400 py-4"><i class="fa-solid fa-circle-notch fa-spin"></i><span>Executing test cases against code...</span></div>`;

      try {
        const res = await fetch('/api/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            problemId: currentProblemId,
            language: currentLanguage,
            code,
            type: 'run'
          })
        });
        const data = await res.json();
        
        if (data.success) {
          const badge = document.getElementById('consoleStatusBadge');
          badge.innerText = data.message;
          badge.className = `text-[11px] px-2 py-0.5 rounded font-medium ${data.allPassed ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}`;

          let resultsHtml = data.results.map(r => `
            <div class="bg-[#1c1c1c] p-3 rounded border ${r.passed ? 'border-emerald-500/30' : 'border-red-500/30'} space-y-1 my-2">
              <div class="flex items-center justify-between">
                <span class="font-semibold ${r.passed ? 'text-emerald-400' : 'text-red-400'}">Test Case ${r.testCase}: ${r.passed ? 'Passed' : 'Failed'}</span>
                <span class="text-gray-500 text-[10px]">Runtime: ${data.runtime}</span>
              </div>
              ${r.input ? `<div class="text-gray-400 text-[11px]">Input: ${r.input}</div>` : ''}
              ${r.expected ? `<div class="text-gray-400 text-[11px]">Expected: ${r.expected}</div>` : ''}
              ${r.output ? `<div class="text-gray-300 text-[11px]">Output: ${r.output}</div>` : ''}
              ${r.error ? `<div class="text-red-400 text-[11px]">Error: ${r.error}</div>` : ''}
            </div>
          `).join('');

          document.getElementById('consoleOutput').innerHTML = `
            <div class="space-y-3">
              <div class="flex items-center justify-between text-xs font-semibold">
                <span class="${data.allPassed ? 'text-emerald-400' : 'text-red-400'} text-sm">${data.message}</span>
                <span class="text-gray-400">Runtime: ${data.runtime} | Memory: ${data.memory}</span>
              </div>
              <div class="space-y-2">${resultsHtml}</div>
            </div>
          `;
          showToast(data.message, data.allPassed ? 'success' : 'error');
        } else {
          showToast(data.error || "Execution failed", "error");
        }
      } catch (err) {
        showToast("Server error during execution", "error");
      } finally {
        runBtn.innerHTML = `<i class="fa-solid fa-play text-emerald-400 text-[10px]"></i><span>Run Code</span>`;
        runBtn.disabled = false;
      }
    }

    async function submitCode() {
      const code = document.getElementById('codeEditor').value;
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-xs"></i><span>Submitting...</span>`;
      submitBtn.disabled = true;

      document.getElementById('consoleOutput').innerHTML = `<div class="flex items-center space-x-2 text-emerald-400 py-4"><i class="fa-solid fa-circle-notch fa-spin"></i><span>Running code against full test suites...</span></div>`;

      try {
        const res = await fetch('/api/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            problemId: currentProblemId,
            language: currentLanguage,
            code,
            type: 'submit'
          })
        });
        const data = await res.json();
        
        if (data.success) {
          const badge = document.getElementById('consoleStatusBadge');
          badge.innerText = data.message;
          badge.className = `text-[11px] px-2 py-0.5 rounded font-medium ${data.allPassed ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}`;

          document.getElementById('consoleOutput').innerHTML = `
            <div class="bg-[#1c1c1c] p-4 rounded-xl border ${data.allPassed ? 'border-emerald-500/40 bg-emerald-950/10' : 'border-red-500/40 bg-red-950/10'} space-y-3">
              <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                  <div class="w-8 h-8 rounded-full ${data.allPassed ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'} flex items-center justify-center">
                    <i class="fa-solid ${data.allPassed ? 'fa-check' : 'fa-xmark'}"></i>
                  </div>
                  <div>
                    <div class="text-sm font-bold ${data.allPassed ? 'text-emerald-400' : 'text-red-400'}">${data.message}</div>
                    <div class="text-[10px] text-gray-400">All hidden & sample test cases evaluated</div>
                  </div>
                </div>
                <div class="text-right text-xs">
                  <div class="text-gray-300"><strong class="text-gray-400">Runtime:</strong> ${data.runtime}</div>
                  <div class="text-gray-300"><strong class="text-gray-400">Memory:</strong> ${data.memory}</div>
                </div>
              </div>
              <div class="text-xs text-gray-400 pt-2 border-t border-[#333]">
                ${data.allPassed ? '🎉 Congratulations! Your solution successfully beats 94.2% of users in runtime performance.' : '⚠️ Some test cases failed. Review your logic and try again.'}
              </div>
            </div>
          `;
          showToast(data.message, data.allPassed ? 'success' : 'error');
        } else {
          showToast(data.error || "Submission failed", "error");
        }
      } catch (err) {
        showToast("Server error during submission", "error");
      } finally {
        submitBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up text-[11px]"></i><span>Submit</span>`;
        submitBtn.disabled = false;
      }
    }

    function toggleConsole() {
      const consolePanel = document.getElementById('consolePanel');
      const chevron = document.getElementById('consoleChevron');
      isConsoleExpanded = !isConsoleExpanded;
      if (isConsoleExpanded) {
        consolePanel.style.height = '16rem';
        chevron.classList.remove('rotate-180');
      } else {
        consolePanel.style.height = '40px';
        chevron.classList.add('rotate-180');
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    function toggleDarkMode() {
      const html = document.documentElement;
      html.classList.toggle('dark');
      const icon = document.getElementById('themeIcon');
      if (html.classList.contains('dark')) {
        icon.className = "fa-solid fa-moon";
        showToast("Dark mode enabled", "info");
      } else {
        icon.className = "fa-solid fa-sun";
        showToast("Light mode enabled", "info");
      }
    }

    function toggleBookmark(btn) {
      const icon = btn.querySelector('i');
      if (icon.classList.contains('fa-regular')) {
        icon.className = "fa-solid fa-bookmark text-amber-400";
        showToast("Problem bookmarked!", "success");
      } else {
        icon.className = "fa-regular fa-bookmark";
        showToast("Bookmark removed", "info");
      }
    }

    function toggleLike(btn) {
      const icon = btn.querySelector('i');
      if (icon.classList.contains('fa-regular')) {
        icon.className = "fa-solid fa-thumbs-up text-red-400";
        showToast("Thank you for your feedback!", "success");
      } else {
        icon.className = "fa-regular fa-thumbs-up";
        showToast("Like removed", "info");
      }
    }

    function shareProblem() {
      navigator.clipboard?.writeText(window.location.href);
      showToast("Problem link copied to clipboard!", "success");
    }

    function switchTab(tab) {
      showToast(`Switched to ${tab} module`, "info");
    }

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toastMessage');
      const toastIcon = document.getElementById('toastIcon');

      toastMessage.innerText = message;
      if (type === 'success') {
        toastIcon.className = "w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs";
        toastIcon.innerHTML = `<i class="fa-solid fa-check"></i>`;
      } else if (type === 'error') {
        toastIcon.className = "w-6 h-6 rounded-full bg-red-500/20 text-red-400 flex items-center justify-center text-xs";
        toastIcon.innerHTML = `<i class="fa-solid fa-xmark"></i>`;
      } else {
        toastIcon.className = "w-6 h-6 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center text-xs";
        toastIcon.innerHTML = `<i class="fa-solid fa-info"></i>`;
      }

      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    // Resizable Splitter Logic
    const resizer = document.getElementById('dragResizer');
    const leftPanel = document.getElementById('leftPanel');
    const rightPanel = document.getElementById('rightPanel');
    let isResizing = false;

    resizer.addEventListener('mousedown', (e) => {
      isResizing = true;
      resizer.classList.add('active');
      document.body.style.cursor = 'col-resize';
    });

    window.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      const totalWidth = window.innerWidth;
      const leftWidth = e.clientX;
      const leftPercent = (leftWidth / totalWidth) * 100;
      if (leftPercent > 20 && leftPercent < 80) {
        leftPanel.style.width = `${leftPercent}%`;
        rightPanel.style.width = `${100 - leftPercent}%`;
      }
    });

    window.addEventListener('mouseup', () => {
      if (isResizing) {
        isResizing = false;
        resizer.classList.remove('active');
        document.body.style.cursor = 'default';
      }
    });

    window.onload = init;
  </script>
</body>
</html>
